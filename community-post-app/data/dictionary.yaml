# 作品辞書。ここを育てるほど抽出精度と文面の質が上がる。AI は一切使わない。
#   name       … 表示名（{作品名} に入る）
#   tag        … ハッシュタグ用（{作品名タグ}）。# は書かない
#   aliases    … 表記ゆれ・英字表記。マッチ判定に使う
#   characters … {キャラ名} 候補
#   phrases    … その作品専用の感想フレーズ（{感想フレーズ}）
works:
  - id: yanineko
    name: ヤニねこ
    tag: ヤニねこ
    aliases: [ヤニ猫, ヤニネコ, yanineko, yani-neko]
    characters: [ヤニねこ, シャブねこ, ハッパねこ]
    phrases:
      - "今回も情緒ぐちゃぐちゃにされた…"
      - "オチの破壊力が毎回おかしい"
      - "コメント欄の語彙力が消える回"
      - "1ページの重みが異常"

  - id: kaguya
    name: 超かぐや姫
    tag: 超かぐや姫
    aliases: [かぐや姫, chou-kaguya, kaguya]
    characters: [かぐや, 帝]
    phrases:
      - "展開が読めなさすぎる"
      - "情報量に脳が追いつかない"
      - "今回もツッコミが追いつかん"

# 作品が特定できなかったときに使う汎用フレーズ
generic_phrases:
  - "コメント欄の温度が高い回でした"
  - "みんなの反応、まとめました"
  - "この回だけは語りたい人が多い"
  - "反応を見てるだけで面白い"

# 記事タイトルからノイズとして落とす語（サイト名など）
title_noise:
  - アニメ
  - 公式サイト
  - ニュース
  - 最新情報
